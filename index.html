<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MathFun FASTA</title>
<style>
  :root{
    --azul:#0a4da2; --azul2:#1565c0; --dorado:#f5c542; --dorado2:#e0a800;
    --verde:#43c463; --naranja:#ff9e3d; --rojo:#ef5350; --violeta:#9b59d0;
    --rosa:#ff6fae; --celeste:#4dd0e1;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;font-family:'Comic Sans MS','Baloo',system-ui,sans-serif;overflow:hidden;}
  body{background:linear-gradient(160deg,#0a4da2 0%,#1565c0 55%,#4dd0e1 130%);color:#fff;user-select:none;}
  #app{position:fixed;inset:0;display:flex;flex-direction:column;}

  .cloud{position:absolute;background:rgba(255,255,255,.16);border-radius:50%;filter:blur(2px);animation:float 20s linear infinite;pointer-events:none;}
  @keyframes float{from{transform:translateX(-25vw)}to{transform:translateX(125vw)}}

  .screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:safe center;padding:60px 14px 28px;position:relative;z-index:2;text-align:center;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .helpbtn{background:var(--dorado);color:#0a2a52;border:none;border-radius:14px;padding:8px 12px;font-size:14px;font-weight:800;font-family:inherit;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.2);}
  .moneybtn{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.25);border-radius:14px;padding:4px;cursor:pointer;font-family:inherit;transition:transform .08s;display:inline-flex;align-items:center;justify-content:center;line-height:0;}
  .moneybtn:active{transform:translateY(3px);}
  .ejehdr{width:100%;max-width:520px;text-align:left;font-weight:800;font-size:clamp(16px,4vw,19px);color:var(--dorado);margin:16px 0 4px 6px;border-bottom:2px solid rgba(255,255,255,.28);padding-bottom:4px;display:flex;align-items:center;gap:8px;}
  .ejesub{width:100%;max-width:520px;text-align:left;font-size:12.5px;opacity:.85;margin:0 0 8px 6px;font-style:italic;}
  .fasta-nota{max-width:520px;font-size:13px;font-style:italic;opacity:.92;margin:20px auto 4px;line-height:1.45;background:rgba(255,255,255,.1);border-radius:14px;padding:12px 14px;}
  .ayuda-back{position:fixed;inset:0;z-index:9999;background:rgba(4,30,60,.75);display:flex;align-items:center;justify-content:center;padding:18px;animation:pop .25s;}
  .ayuda-card{background:#fff;color:#0a2a52;border-radius:22px;max-width:470px;width:95%;padding:22px;box-shadow:0 14px 44px rgba(0,0,0,.45);text-align:left;max-height:86vh;overflow-y:auto;}
  /* respaldo para navegadores viejos que no entienden "safe center" */
  @supports not (justify-content:safe center){ .screen{justify-content:flex-start;} }
  h1{font-size:clamp(28px,7vw,50px);margin:.02em 0 .08em;color:var(--dorado);text-shadow:0 3px 0 var(--dorado2),0 6px 10px rgba(0,0,0,.3);}
  .sub{font-size:clamp(14px,3.5vw,20px);opacity:.95;margin:0 0 8px;}

  .card{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);border-radius:24px;padding:22px;max-width:520px;width:92%;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:pop .5s;}
  .frase{font-style:italic;font-size:clamp(16px,4vw,22px);line-height:1.4;color:#fff;margin:10px 0;}
  .frase .autor{display:block;font-style:normal;font-size:.75em;color:var(--dorado);margin-top:8px;}

  .menugrid{display:flex;flex-wrap:wrap;justify-content:center;align-items:stretch;gap:12px;width:100%;max-width:740px;margin:4px auto 2px;}
  .bigbtn{border:none;border-radius:24px;padding:18px 16px;margin:0;flex:1 1 250px;min-width:220px;max-width:340px;font-family:inherit;font-size:clamp(16px,4vw,22px);font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 7px 0 rgba(0,0,0,.22),0 10px 18px rgba(0,0,0,.25);display:flex;align-items:center;gap:12px;justify-content:center;transition:transform .08s,box-shadow .08s;animation:pop .4s;}
  .bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 rgba(0,0,0,.22);}
  .bigbtn .emo{font-size:1.5em;}
  .bigbtn small{display:block;font-size:.58em;font-weight:normal;opacity:.9;margin-top:2px;}
  @keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}

  .mascot{font-size:clamp(50px,12vw,84px);line-height:.82;margin:0;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3));}
  @keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}

  .field{width:min(360px,90vw);margin:8px auto;text-align:left;}
  .field label{display:block;font-size:15px;color:var(--dorado);margin-bottom:4px;font-weight:bold;}
  .field input,.field select{width:100%;padding:14px;border-radius:16px;border:none;font-family:inherit;font-size:17px;color:var(--azul);}
  .grid2{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

  .topbar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:680px;position:absolute;top:0;left:50%;transform:translateX(-50%);padding:12px 16px;z-index:5;}
  .backbtn{background:rgba(255,255,255,.2);border:none;color:#fff;font-family:inherit;font-size:15px;font-weight:bold;padding:8px 14px;border-radius:20px;cursor:pointer;}
  .who{background:rgba(255,255,255,.15);padding:8px 14px;border-radius:20px;font-size:14px;font-weight:bold;}
  .starcount{background:rgba(0,0,0,.22);padding:8px 14px;border-radius:20px;font-size:17px;font-weight:bold;color:var(--dorado);}

  .instr{font-size:clamp(15px,3.6vw,20px);margin:10px 0;max-width:680px;line-height:1.35;}
  .op{font-size:clamp(32px,9vw,56px);font-weight:bold;color:var(--dorado);text-shadow:0 3px 0 var(--dorado2);margin:6px 0;}

  .setcircle{width:min(320px,86vw);min-height:min(190px,40vh);border-radius:50%;border:6px dashed var(--dorado);background:rgba(255,255,255,.12);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:2px;padding:16px;margin:6px auto;}
  .obj{font-size:clamp(28px,7vw,44px);cursor:pointer;transition:transform .12s;animation:drop .4s;filter:drop-shadow(0 3px 3px rgba(0,0,0,.25));}
  .obj:active{transform:scale(.8);}
  @keyframes drop{from{transform:translateY(-40px) scale(.4);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
  .wiggle{animation:wiggle 1.4s ease-in-out infinite;}
  @keyframes wiggle{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}

  .bank{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:8px 0;max-width:680px;}
  .bankitem{background:rgba(255,255,255,.9);border-radius:16px;padding:6px 10px;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.15);transition:transform .08s;}
  .bankitem:active{transform:translateY(3px);}

  .cols{display:flex;gap:16px;justify-content:center;margin:8px 0;flex-wrap:wrap;}
  .col{min-width:130px;}
  .coltitle{font-size:14px;color:var(--dorado);font-weight:bold;margin-bottom:4px;}
  .colbox{min-width:130px;min-height:120px;border:3px solid rgba(255,255,255,.4);border-radius:16px;background:rgba(255,255,255,.1);display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:3px;padding:8px;}
  .bag{font-size:36px;cursor:pointer;animation:drop .4s;filter:drop-shadow(0 3px 4px rgba(0,0,0,.3));}
  .bag:active{transform:scale(.85);}
  .unit{font-size:24px;animation:drop .35s;}
  .colval{font-size:14px;margin-top:6px;opacity:.9;}
  .total{font-size:clamp(20px,5vw,28px);font-weight:bold;margin:8px 0;}

  .actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px;}
  .abtn{border:none;border-radius:20px;padding:15px 22px;font-family:inherit;font-size:clamp(15px,4vw,19px);font-weight:bold;color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2);transition:transform .08s;}
  .abtn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2);}

  .msg{font-size:clamp(19px,5vw,28px);font-weight:bold;margin-top:14px;min-height:1.2em;}
  .msg.ok{color:#b9ffce;animation:popbig .5s;}
  .msg.bad{color:#ffd6d6;}
  @keyframes popbig{0%{transform:scale(.3)}60%{transform:scale(1.25)}100%{transform:scale(1)}}

  #confetti{position:fixed;inset:0;pointer-events:none;z-index:50;}
  .confe{position:absolute;width:12px;height:12px;top:-20px;animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}

  .choicegrid{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:8px;}
  .choice{background:#fff;color:var(--azul);border:none;border-radius:18px;width:66px;height:66px;font-size:26px;font-weight:bold;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.15);transition:transform .08s;}
  .choice.txt{width:auto;min-width:78px;height:auto;min-height:58px;padding:10px 16px;font-size:clamp(15px,3.6vw,19px);line-height:1.15;display:inline-flex;align-items:center;justify-content:center;text-align:center;white-space:nowrap;}
  .choice:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.15);}
</style>
</head>
<body>
<div id="confetti"></div>
<div id="app"></div>

<script>
/* ============================================================
   MathFun FASTA - App web v2
   Bienvenida + Ingreso alumno + 1er GRADO completo
   Colegio FASTA Juan Pablo II - Mendoza
   ============================================================ */

const app=document.getElementById('app');
let alumno={nombre:'',nivel:'',grado:''};
let estrellas=0;

const EMO={apple:'🍎',star:'⭐',car:'🚗',animal:'🐱',flower:'🌸',fish:'🐠'};
const TIPOS=Object.keys(EMO);
const DINERO_COL={
  1:{tipo:'moneda',c1:'#d79a63',c2:'#a86a34'},
  5:{tipo:'moneda',c1:'#d9dde2',c2:'#9aa0a8'},
  10:{tipo:'billete',c1:'#9aa84a',c2:'#5f7327',txt:'#fff'},
  20:{tipo:'billete',c1:'#db5a5a',c2:'#a12f2f',txt:'#fff'},
  50:{tipo:'billete',c1:'#38a89a',c2:'#1f6f66',txt:'#fff'},
  100:{tipo:'billete',c1:'#8a70cf',c2:'#54408f',txt:'#fff'},
  500:{tipo:'billete',c1:'#46a857',c2:'#2a6e37',txt:'#fff'},
  1000:{tipo:'billete',c1:'#e0954a',c2:'#a85f22',txt:'#fff'},
  2000:{tipo:'billete',c1:'#cf5a98',c2:'#8f2f63',txt:'#fff'},
  10000:{tipo:'billete',c1:'#c39a3f',c2:'#836223',txt:'#fff'},
  20000:{tipo:'billete',c1:'#5a8bcf',c2:'#2f548f',txt:'#fff'}
};
function dineroFig(v){
  const d=DINERO_COL[v]||{tipo:'billete',c1:'#8a8a8a',c2:'#555',txt:'#fff'};
  const s=String(v);
  if(d.tipo==='moneda'){
    return `<svg viewBox="0 0 60 60" width="46" height="46" style="margin:3px;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))">
      <defs><radialGradient id="cn${v}" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="${d.c1}"/><stop offset="1" stop-color="${d.c2}"/></radialGradient></defs>
      <circle cx="30" cy="30" r="27" fill="url(#cn${v})" stroke="${d.c2}" stroke-width="2"/>
      <circle cx="30" cy="30" r="21" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="1.5"/>
      <text x="30" y="36" text-anchor="middle" font-size="23" font-weight="900" fill="#3a2a12" font-family="Arial">${v}</text>
      <text x="30" y="48" text-anchor="middle" font-size="6" font-weight="700" fill="#3a2a12" font-family="Arial">PESOS</text></svg>`;
  }
  const fs=s.length<=2?24:(s.length===3?19:(s.length===4?15:12));
  return `<svg viewBox="0 0 120 66" width="90" height="50" style="margin:3px;vertical-align:middle;filter:drop-shadow(0 2px 3px rgba(0,0,0,.28))">
    <defs><linearGradient id="bl${v}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${d.c1}"/><stop offset="1" stop-color="${d.c2}"/></linearGradient></defs>
    <rect x="2" y="2" width="116" height="62" rx="8" fill="url(#bl${v})" stroke="rgba(255,255,255,.55)" stroke-width="2"/>
    <ellipse cx="34" cy="33" rx="24" ry="20" fill="rgba(255,255,255,.16)"/>
    <text x="88" y="38" text-anchor="middle" font-size="${fs}" font-weight="900" fill="${d.txt}" font-family="Arial">${v}</text>
    <text x="88" y="51" text-anchor="middle" font-size="7" font-weight="700" fill="${d.txt}" font-family="Arial" opacity=".92">PESOS</text>
    <text x="60" y="61" text-anchor="middle" font-size="5.5" fill="${d.txt}" opacity=".82" font-family="Arial">REPÚBLICA ARGENTINA</text></svg>`;
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];

/* ---- Voz ---- */
function hablar(t,alTerminar){
  const avanzar=()=>{if(alTerminar){const f=alTerminar;alTerminar=null;setTimeout(f,650);}};
  try{if(!window.speechSynthesis){if(alTerminar)setTimeout(avanzar,2600);return;}
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.95;u.pitch=1.2;
    const v=speechSynthesis.getVoices().find(x=>x.lang.startsWith('es'));if(v)u.voice=v;
    u.onend=avanzar;u.onerror=avanzar;
    speechSynthesis.speak(u);
    /* red de seguridad: si el navegador no avisa el fin, avanzamos igual */
    setTimeout(avanzar,Math.max(2900,t.length*95));
  }catch(e){if(alTerminar)setTimeout(avanzar,2600);}}
if(window.speechSynthesis){speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}

/* ---- Confeti ---- */
function festejar(){const cont=document.getElementById('confetti');
  const col=['#f5c542','#43c463','#ff6fae','#4dd0e1','#ff9e3d','#9b59d0'];
  for(let i=0;i<60;i++){const c=document.createElement('div');c.className='confe';
    c.style.left=Math.random()*100+'vw';c.style.background=pick(col);
    c.style.borderRadius=Math.random()<.5?'50%':'2px';
    c.style.animationDuration=(1+Math.random()*1.5)+'s';c.style.animationDelay=(Math.random()*.3)+'s';
    cont.appendChild(c);setTimeout(()=>c.remove(),2700);}}
function estrella(){estrellas++;}

function fondo(){return `
  <div class="cloud" style="width:70px;height:34px;top:8%;animation-duration:16s"></div>
  <div class="cloud" style="width:110px;height:50px;top:22%;animation-duration:24s"></div>
  <div class="cloud" style="width:60px;height:30px;top:60%;animation-duration:19s"></div>`;}

function topbar(){return `<div class="topbar">
  <button class="backbtn" onclick="menuGrado()">‹ Juegos</button>
  <div class="who">👦 ${alumno.nombre||'Alumno'}</div>
  ${alumno.grado==='3'?`<button class="helpbtn" onclick="mostrarAyuda()">💡 ¿Cómo se hace?</button>`:''}
  <div class="starcount">⭐ ${estrellas}</div>
</div>`;}

/* ============================================================
   1) BIENVENIDA  (frase de San Agustín)
   ============================================================ */
function bienvenida(){
  speechSynthesis&&speechSynthesis.cancel();
  app.innerHTML=fondo()+`
  <div class="screen">
    <div class="mascot">🦉</div>
    <h1>MathFun FASTA</h1>
    <div class="card">
      <div class="frase">"Los números son el lenguaje con que Dios escribió el universo."
        <span class="autor">— San Agustín</span></div>
      <div class="sub" style="margin-top:8px">Vas a aprender a contar, agrupar y calcular descubriendo el orden hermoso de la creación. ✨</div>
    </div>
    <button class="bigbtn" style="background:var(--verde);margin-top:18px" onclick="ingreso()">
      <span class="emo">👦</span><span>Soy Alumno · Empezar</span>
    </button>
    <div class="sub" style="opacity:.7;margin-top:14px">Colegio FASTA Juan Pablo II · Mendoza</div>
  </div>`;
}

/* ============================================================
   2) INGRESO DEL ALUMNO (nombre + nivel + grado)
   ============================================================ */
function ingreso(){
  app.innerHTML=fondo()+`
  <div class="screen" style="padding-top:24px">
    <button class="backbtn" style="align-self:flex-start;margin:8px" onclick="bienvenida()">‹ Volver</button>
    <h1 style="font-size:clamp(24px,6vw,38px)">¡Hola! ¿Quién sos?</h1>
    <div class="card">
      <div class="field">
        <label>Tu nombre</label>
        <input id="inNombre" placeholder="Escribí tu nombre" value="${alumno.nombre}">
      </div>
      <div class="field">
        <label>Nivel</label>
        <select id="inNivel" onchange="cambioNivel()">
          <option value="">Elegí tu nivel</option>
          <option value="inicial">Nivel Inicial (Jardín)</option>
          <option value="primaria">Nivel Primario</option>
        </select>
      </div>
      <div class="field">
        <label>Grado / Sala</label>
        <select id="inGrado">
          <option value="">Primero elegí el nivel</option>
        </select>
      </div>
      <button class="bigbtn" style="background:var(--naranja);width:min(360px,90vw);max-width:none;margin:16px auto 0" onclick="entrar()">
        <span class="emo">🚀</span><span>Entrar a mis juegos</span>
      </button>
    </div>
  </div>`;
}
function cambioNivel(){
  const n=document.getElementById('inNivel').value;
  const g=document.getElementById('inGrado');
  if(n==='inicial'){
    g.innerHTML=`<option value="">Elegí tu sala</option>
      <option value="sala3">Sala de 3</option>
      <option value="sala4">Sala de 4</option>
      <option value="sala5">Sala de 5</option>`;
  }else if(n==='primaria'){
    g.innerHTML=`<option value="">Elegí tu grado</option>
      <option value="1">1° Grado</option>
      <option value="2">2° Grado</option>
      <option value="3">3° Grado</option>`;
  }else{
    g.innerHTML=`<option value="">Primero elegí el nivel</option>`;
  }
}
function entrar(){
  const nombre=document.getElementById('inNombre').value.trim();
  const nivel=document.getElementById('inNivel').value;
  const grado=document.getElementById('inGrado').value;
  if(!nombre){alert('Escribí tu nombre 😊');return;}
  if(!nivel||!grado){alert('Elegí tu nivel y grado 😊');return;}
  alumno={nombre,nivel,grado};
  hablar(`Hola ${nombre}. Bienvenido a tus juegos.`);
  menuGrado();
}

/* ============================================================
   3) MENU DE JUEGOS SEGUN EL GRADO
   ============================================================ */
function menuGrado(){
  speechSynthesis&&speechSynthesis.cancel();
  if(alumno.nivel==='primaria'&&alumno.grado==='1'){
    app.innerHTML=fondo()+`
    <div class="topbar">
      <button class="backbtn" onclick="ingreso()">‹ Salir</button>
      <div class="who">👦 ${alumno.nombre}</div>
      <div class="starcount">⭐ ${estrellas}</div>
    </div>
    <div class="screen">
      <div class="mascot" style="font-size:52px">🦉</div>
      <h1 style="font-size:clamp(24px,6vw,38px)">1° Grado</h1>
      <div class="sub">Elegí un juego, ${alumno.nombre} 👇</div>
      <div class="menugrid">
      <button class="bigbtn" style="background:var(--verde)" onclick="jContar()">
        <span class="emo">🍎</span><span>Contar colecciones<small>hasta 20</small></span></button>
      <button class="bigbtn" style="background:var(--celeste)" onclick="jValor()">
        <span class="emo">🔟</span><span>Dieces y unos<small>valor posicional</small></span></button>
      <button class="bigbtn" style="background:var(--naranja)" onclick="jSumar()">
        <span class="emo">➕</span><span>Sumar juntando<small>unir y agregar</small></span></button>
      <button class="bigbtn" style="background:var(--violeta)" onclick="jRestar()">
        <span class="emo">➖</span><span>Restar quitando<small>quitar</small></span></button>
      <button class="bigbtn" style="background:var(--rosa)" onclick="jRecta()">
        <span class="emo">🐸</span><span>Avanzar y retroceder<small>recta numérica</small></span></button>
      <button class="bigbtn" style="background:var(--celeste)" onclick="jFiguras1()">
        <span class="emo">🔷</span><span>Figuras<small>círculo, cuadrado…</small></span></button>
      <button class="bigbtn" style="background:var(--dorado)" onclick="jReloj()">
        <span class="emo">🕐</span><span>La hora<small>horas en punto</small></span></button>
      <button class="bigbtn" style="background:var(--verde)" onclick="jCalendario()">
        <span class="emo">📅</span><span>El calendario<small>ayer, hoy, mañana</small></span></button>
      <button class="bigbtn" style="background:var(--naranja)" onclick="jDinero1()">
        <span class="emo">💰</span><span>Armar dinero<small>billetes y monedas</small></span></button>
      </div>
    </div>`;
  }else if(alumno.nivel==='primaria'&&alumno.grado==='2'){
    app.innerHTML=fondo()+`
    <div class="topbar">
      <button class="backbtn" onclick="ingreso()">‹ Salir</button>
      <div class="who">👦 ${alumno.nombre}</div>
      <div class="starcount">⭐ ${estrellas}</div>
    </div>
    <div class="screen">
      <div class="mascot" style="font-size:52px">🦉</div>
      <h1 style="font-size:clamp(24px,6vw,38px)">2° Grado</h1>

   Sentidos del currículo: avanzar / retroceder
   ============================================================ */
let rc_max,rc_pos,rc_ini,rc_paso,rc_dir,rc_obj,rc_listo;
function jRecta(){
  rc_max=15;rc_ini=rnd(2,10);rc_dir=Math.random()<.5?'avanzar':'retroceder';
  if(rc_dir==='avanzar'){rc_paso=rnd(2,Math.min(5,rc_max-rc_ini));rc_obj=rc_ini+rc_paso;}
  else{rc_paso=rnd(2,Math.min(5,rc_ini));rc_obj=rc_ini-rc_paso;}
  rc_pos=rc_ini;rc_listo=false;render_recta('');
  hablar(`Estás en el ${rc_ini}. ${rc_dir==='avanzar'?'Avanzá':'Retrocedé'} ${rc_paso} lugares con la rana.`);
}
function render_recta(msg){
  let linea='';
  for(let i=0;i<=rc_max;i++){
    const aca=i===rc_pos;
    linea+=`<div style="display:flex;flex-direction:column;align-items:center;min-width:30px">
      <div style="height:34px;font-size:26px">${aca?'🐸':''}</div>
      <div style="width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:15px;background:${i===rc_obj?'var(--dorado)':(aca?'var(--verde)':'rgba(255,255,255,.15)')};
        color:${i===rc_obj||aca?'#0a2a52':'#fff'}">${i}</div></div>`;
  }
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op">${rc_ini} ${rc_dir==='avanzar'?'+':'−'} ${rc_paso} = ?</div>
    <div class="instr">La rana 🐸 está en el <b>${rc_ini}</b>. <b>${rc_dir==='avanzar'?'Avanzá':'Retrocedé'} ${rc_paso}</b> lugares (casillero dorado ⭐).</div>
    <div style="display:flex;gap:2px;overflow-x:auto;padding:10px 4px;max-width:100%">${linea}</div>
    <div class="actions">
      <button class="abtn" style="background:var(--rojo)" onclick="rcMover(-1)">◀ Retroceder</button>
      <button class="abtn" style="background:var(--verde)" onclick="rcMover(1)">Avanzar ▶</button>
    </div>
    <div class="msg ${msg.includes('Muy')?'ok':'bad'}">${msg}</div>
  </div>`;
}
function rcMover(d){if(rc_listo)return;
  rc_pos=Math.max(0,Math.min(rc_max,rc_pos+d));
  if(rc_pos===rc_obj){rc_listo=true;estrella();festejar();
    render_recta(`¡Muy bien! Llegaste al ${rc_obj} 🎉`);
    hablar(`¡Excelente! ${rc_ini} ${rc_dir==='avanzar'?'más':'menos'} ${rc_paso} es ${rc_obj}`, jRecta);}
  else render_recta('');
}

/* ============================================================
   JUEGO G (1°) - LA HORA (leer horas en punto)
   ============================================================ */
let rl_h;
function jReloj(){rl_h=rnd(1,12);render_reloj('');hablar('¿Qué hora es? Mirá la aguja corta.');}
function relojSVG(h){
  let nums='';
  for(let i=1;i<=12;i++){
    const ang=(i*30-90)*Math.PI/180;
    const x=100+72*Math.cos(ang),y=100+72*Math.sin(ang);
    nums+=`<text x="${x.toFixed(1)}" y="${(y+6).toFixed(1)}" text-anchor="middle" font-size="18" font-weight="800" fill="#0a2a52">${i}</text>`;
  }
  const ha=(h%12*30-90)*Math.PI/180;
  const hx=100+45*Math.cos(ha),hy=100+45*Math.sin(ha);
  return `<svg viewBox="0 0 200 200" width="180" height="180">
    <circle cx="100" cy="100" r="94" fill="#fff" stroke="var(--azul)" stroke-width="6"/>
    ${nums}
    <line x1="100" y1="100" x2="100" y2="34" stroke="var(--rojo)" stroke-width="4" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--azul)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="var(--azul)"/></svg>`;
}
function render_reloj(msg){
  const set=new Set([rl_h]);while(set.size<4){set.add(rnd(1,12));}
  const ops=[...set].sort((a,b)=>a-b);
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op">¿Qué hora es?</div>
    <div class="instr">La aguja <b>corta</b> marca la hora. Está <b>en punto</b>.</div>
    <div style="display:flex;justify-content:center;margin:8px 0">${relojSVG(rl_h)}</div>
    <div class="choicegrid">${ops.map(n=>`<button class="choice txt" onclick="respReloj(${n})">${n} en punto</button>`).join('')}</div>
    <div class="msg ${msg.includes('Muy')?'ok':'bad'}">${msg}</div>
  </div>`;
}
function respReloj(n){if(n===rl_h){estrella();festejar();render_reloj(`¡Muy bien! Son las ${rl_h} en punto 🎉`);
  hablar(`¡Correcto! Son las ${rl_h} en punto`, jReloj);}
  else{render_reloj('Mirá la aguja CORTA: el número que señala es la hora 😊');hablar('La aguja corta te dice la hora.');}}

/* opciones de respuesta (incluye la correcta + distractores) */
function opciones(correcta,min,max){
  const set=new Set([correcta]);
  while(set.size<4){const n=rnd(Math.max(min,correcta-3),Math.min(max,correcta+3));set.add(n);}
  return [...set].sort((a,b)=>a-b);
}

let rt_tipo,rt_ang;
function jRectas(){juegoActual='rectas';rt_tipo=pick(['paralelas','perpendiculares']);rt_ang=pick([0,30,45,90,120]);
  render_rectas('');hablar('¿Cómo son estas rectas? ¿Paralelas o perpendiculares?');}
function rectasSVG(tipo,ang){
  const Cx=110,Cy=85,L=70,rad=Math.PI/180;
  const dx=Math.cos(ang*rad),dy=Math.sin(ang*rad);
  const px=-Math.sin(ang*rad),py=Math.cos(ang*rad);
  const seg=(cx,cy,ux,uy,col)=>`<line x1="${(cx-ux*L).toFixed(1)}" y1="${(cy-uy*L).toFixed(1)}" x2="${(cx+ux*L).toFixed(1)}" y2="${(cy+uy*L).toFixed(1)}" stroke="${col}" stroke-width="7" stroke-linecap="round"/>`;
  let lines;
  if(tipo==='paralelas'){const g=26;
    lines=seg(Cx+px*g,Cy+py*g,dx,dy,'var(--azul)')+seg(Cx-px*g,Cy-py*g,dx,dy,'var(--naranja)');}
  else{const d2x=Math.cos((ang+90)*rad),d2y=Math.sin((ang+90)*rad);
    lines=seg(Cx,Cy,dx,dy,'var(--azul)')+seg(Cx,Cy,d2x,d2y,'var(--naranja)');}
  return `<svg viewBox="0 0 220 170" width="240" height="180">${lines}</svg>`;
}
function render_rectas(msg){
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op">¿Cómo son estas rectas?</div>
    <div class="instr"><b>Paralelas</b>: nunca se cruzan. <b>Perpendiculares</b>: se cruzan formando una esquina (90°).</div>

      <button class="abtn" style="background:var(--celeste)" onclick="respRectas('paralelas')">Paralelas</button>

    </div>
    <div class="msg ${msg.includes('Muy')?'ok':'bad'}">${msg}</div>
  </div>`;
}

  hablar('¿Qué hora es? Mirá la aguja larga para los minutos.');}
function relojSVG2(h,m){
  let nums='';
  for(let i=1;i<=12;i++){const ang=(i*30-90)*Math.PI/180;const x=100+72*Math.cos(ang),y=100+72*Math.sin(ang);
    nums+=`<text x="${x.toFixed(1)}" y="${(y+6).toFixed(1)}" text-anchor="middle" font-size="18" font-weight="800" fill="#0a2a52">${i}</text>`;}
  const hr=(((h%12)+m/60)*30-90)*Math.PI/180;
  const hx=100+42*Math.cos(hr),hy=100+42*Math.sin(hr);
  const mr=(m*6-90)*Math.PI/180;
  const mx=100+66*Math.cos(mr),my=100+66*Math.sin(mr);
  return `<svg viewBox="0 0 200 200" width="180" height="180">
    <circle cx="100" cy="100" r="94" fill="#fff" stroke="var(--azul)" stroke-width="6"/>${nums}
    <line x1="100" y1="100" x2="${hx.toFixed(1)}" y2="${hy.toFixed(1)}" stroke="var(--azul)" stroke-width="8" stroke-linecap="round"/>
    <line x1="100" y1="100" x2="${mx.toFixed(1)}" y2="${my.toFixed(1)}" stroke="var(--rojo)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="7" fill="var(--azul)"/></svg>`;
}
function fmtHora(h,m){return `${h}:${String(m).padStart(2,'0')}`;}
function render_hora3(msg){
  const correcto=fmtHora(h3_h,h3_m);const set=new Set([correcto]);
  while(set.size<4){set.add(fmtHora(rnd(1,12),pick([0,15,30,45])));}
  const ops=[...set].sort(()=>Math.random()-.5);
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op">¿Qué hora es?</div>
    <div class="instr">Aguja <b>corta</b>: la hora. Aguja <b>larga</b> (roja): los minutos.</div>
    <div style="display:flex;justify-content:center;margin:8px 0">${relojSVG2(h3_h,h3_m)}</div>
    <div class="choicegrid">${ops.map(t=>`<button class="choice txt" onclick="respHora3('${t}')">${t}</button>`).join('')}</div>
    <div class="msg ${msg.includes('Muy')?'ok':'bad'}">${msg}</div>
  </div>`;
}
function respHora3(t){const correcto=fmtHora(h3_h,h3_m);
  if(t===correcto){estrella();festejar();render_hora3(`¡Muy bien! Son las ${correcto} 🎉`);
    const dicho=h3_m===0?`las ${h3_h} en punto`:(h3_m===15?`las ${h3_h} y cuarto`:(h3_m===30?`las ${h3_h} y media`:`las ${h3_h} y ${h3_m}`));
    hablar(`¡Correcto! Son ${dicho}`, jHora3);}
  else{render_hora3('Aguja CORTA = la hora. Aguja LARGA roja = los minutos 😊');hablar('La aguja larga marca los minutos.');}}

/* ============================================================
   ====  JUEGOS DE 3° GRADO — Eje ESTADÍSTICA Y PROBABILIDAD ==
   ============================================================ */

/* --- U) LEER UN GRÁFICO DE BARRAS (organizar e interpretar datos) --- */
let gr_cats,gr_preg,gr_resp,gr_ops,gr_esNum;
function jGrafico(){
  juegoActual='grafico';
  const pool=[{e:'🍎',n:'manzana'},{e:'🍌',n:'banana'},{e:'🍇',n:'uva'},{e:'🍊',n:'naranja'},{e:'🍓',n:'frutilla'}];
  gr_cats=[...pool].sort(()=>Math.random()-.5).slice(0,3).map(c=>({e:c.e,n:c.n,v:rnd(2,8)}));
  const maxv=Math.max(...gr_cats.map(c=>c.v));
  if(gr_cats.filter(c=>c.v===maxv).length>1){gr_cats[gr_cats.findIndex(c=>c.v===maxv)].v=maxv+1;}
  const q=pick(['max','valor','total','dif']);
  const vs=gr_cats.map(c=>c.v),tot=vs.reduce((a,b)=>a+b,0),mx=Math.max(...vs);
  if(q==='max'){gr_preg='¿Qué eligieron MÁS?';gr_resp=gr_cats.find(c=>c.v===mx).n;gr_esNum=false;gr_ops=gr_cats.map(c=>c.n).sort(()=>Math.random()-.5);}
  else if(q==='total'){gr_preg='¿Cuántos votaron en total?';gr_resp=tot;gr_esNum=true;gr_ops=opciones(tot,1,40);}
  else if(q==='valor'){const c=gr_cats[rnd(0,gr_cats.length-1)];gr_preg=`¿Cuántos eligieron ${c.n} ${c.e}?`;gr_resp=c.v;gr_esNum=true;gr_ops=opciones(c.v,1,14);}
  else{const s=[...gr_cats].sort((a,b)=>b.v-a.v);gr_preg=`¿Cuántos MÁS eligieron ${s[0].n} que ${s[s.length-1].n}?`;gr_resp=s[0].v-s[s.length-1].v;gr_esNum=true;gr_ops=opciones(gr_resp,1,14);}
  render_grafico('');hablar('Mirá el gráfico. '+gr_preg);
}
function render_grafico(msg){
  const bars=gr_cats.map(c=>{
    const blocks=Array.from({length:c.v}).map(()=>`<span style="width:18px;height:18px;background:var(--celeste);border-radius:4px;display:inline-block"></span>`).join('');
    return `<div style="display:flex;align-items:center;gap:6px;margin:5px 0">
      <span style="width:32px;font-size:22px;text-align:center">${c.e}</span>
      <div style="display:flex;gap:3px;flex-wrap:wrap;flex:1">${blocks}</div>
      <b style="min-width:20px">${c.v}</b></div>`;}).join('');
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op" style="font-size:clamp(18px,4.5vw,24px)">🍉 Frutas preferidas del grado</div>
    <div class="instr">${gr_preg}</div>
    <div style="background:rgba(255,255,255,.1);border-radius:16px;padding:14px;margin:8px 0;width:min(360px,90vw)">${bars}</div>
    <div class="choicegrid">${gr_ops.map(o=>`<button class="choice${gr_esNum?'':' txt'}" onclick="respGrafico('${o}')">${o}</button>`).join('')}</div>
    <div class="msg ${msg.includes('Muy')?'ok':'bad'}">${msg}</div>
  </div>`;
}
function respGrafico(o){
  if(String(o)===String(gr_resp)){estrella();festejar();render_grafico('¡Muy bien! 🎉');
    hablar(`¡Correcto! La respuesta es ${gr_resp}`, jGrafico);}
  else{render_grafico('Contá los cuadraditos de cada barra 😊');hablar('Contá los cuadraditos de cada barra.');}
}

/* --- V) PROBABILIDAD: SEGURO, POSIBLE O IMPOSIBLE --- */
let pb_bolsa,pb_evento,pb_resp;
function jProbable(){
  juegoActual='probable';
  const cols=[{e:'🔴',n:'roja'},{e:'🔵',n:'azul'},{e:'🟢',n:'verde'},{e:'🟡',n:'amarilla'}];
  const bar=[...cols].sort(()=>Math.random()-.5);const A=bar[0],B=bar[1];
  pb_resp=pick(['seguro','posible','imposible']);
  if(pb_resp==='seguro'){const k=rnd(3,6);pb_bolsa=Array.from({length:k}).map(()=>A);pb_evento=A;}
  else if(pb_resp==='imposible'){const k=rnd(3,6);pb_bolsa=Array.from({length:k}).map(()=>A);pb_evento=B;}
  else{const ka=rnd(2,4),kb=rnd(2,4);pb_bolsa=[...Array.from({length:ka}).map(()=>A),...Array.from({length:kb}).map(()=>B)].sort(()=>Math.random()-.5);pb_evento=A;}
  render_probable('');
  hablar(`Si sacás una bolita sin mirar, sacar una ${pb_evento.n}, ¿es seguro, posible o imposible?`);
}
function render_probable(msg){
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op">¿Seguro, posible o imposible?</div>
    <div class="instr"><b>Seguro</b>: pasa siempre. <b>Posible</b>: puede pasar. <b>Imposible</b>: no puede pasar.</div>
    <div style="font-size:38px;line-height:1.5;background:rgba(255,255,255,.12);border-radius:20px;padding:16px;margin:8px 0;max-width:92vw">👜<br>${pb_bolsa.map(c=>c.e).join(' ')}</div>
    <div class="instr">Sacar una bolita <b>${pb_evento.n}</b> ${pb_evento.e} es…</div>
    <div class="actions">
      <button class="abtn" style="background:var(--verde)" onclick="respProbable('seguro')">Seguro</button>
      <button class="abtn" style="background:var(--naranja)" onclick="respProbable('posible')">Posible</button>
      <button class="abtn" style="background:var(--rojo)" onclick="respProbable('imposible')">Imposible</button>
    </div>
    <div class="msg ${msg.includes('Muy')?'ok':'bad'}">${msg}</div>
  </div>`;
}
function respProbable(r){
  if(r===pb_resp){estrella();festejar();render_probable(`¡Muy bien! Es ${pb_resp} 🎉`);
    hablar(`¡Correcto! Es ${pb_resp}`, jProbable);}
  else{const h=pb_resp==='seguro'?'Todas las bolitas son de ese color: pasa siempre 😊'
      :pb_resp==='imposible'?'No hay ninguna bolita de ese color: no puede pasar 😊'
      :'Hay de ese color y también de otro: puede pasar o no 😊';
    render_probable(h);hablar('Mirá cuántas bolitas de ese color hay en la bolsa.');}
}

/* ============================================================
   JUEGO (1°) - ARMAR DINERO (formar una cantidad indicada)
   Billetes: $10 $20 $50 $100  ·  Monedas: $1 $5
   ============================================================ */
let d1_obj,d1_have,d1_listo,d1_cont;
function jDinero1(){juegoActual='dinero1';d1_cont=0;d1NuevaRonda();}
function d1Siguiente(){d1_cont++;d1NuevaRonda();}
function d1NuevaRonda(){d1_obj=d1Meta(d1_cont);d1_have=[];d1_listo=false;render_d1('');d1Decir(true);}
function d1Meta(n){
  if(n<3) return pick([1,2,3,5,6,10]);            // muy fácil: 1 o 2 piezas
  if(n<6) return pick([5,7,10,11,15,16,20,25]);   // fácil
  if(n<10) return rnd(6,40);                       // medio
  return rnd(20,99);                               // completo
}
function d1Decir(conIntro){
  if(conIntro)hablar(`Vamos a armar ${d1_obj} pesos. Tocá los billetes y las monedas para juntar esa plata.`);
  else hablar(`Tenés que armar ${d1_obj} pesos.`);
}
function d1_total(){return d1_have.reduce((a,b)=>a+b,0);}
function d1Vis(v){ return dineroFig(v); }
function render_d1(msg){
  const t=d1_total();
  app.innerHTML=fondo()+topbar()+`
  <div class="screen">
    <div class="op">Armá $${d1_obj}</div>
    <div class="instr">Tocá los billetes 💵 y monedas 🪙 de abajo hasta llegar a <b>$${d1_obj}</b>.</div>
    <div class="actions" style="margin:2px 0 8px">
      <button class="helpbtn" style="background:var(--celeste);color:#fff" onclick="d1Decir(false)">🔊 Escuchar de nuevo</button>
      <button class="helpbtn" onclick="mostrarAyuda()">💡 ¿Cómo se hace?</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;justify-content:center;align-items:center;min-height:58px;max-width:94vw;background:rgba(255,255,255,.1);border-radius:16px;padding:10px;margin:8px 0">${d1_have.length?d1_have.map(d1Vis).join(''):'<span style="opacity:.7">Todavía no pusiste dinero</span>'}</div>
    <div class="total">Tenés: $${t}</div>
    <div class="instr" style="margin-top:6px">Tocá para agregar:</div>
    <div class="actions">
      <button class="moneybtn" onclick="d1Add(100)">${dineroFig(100)}</button>
      <button class="moneybtn" onclick="d1Add(50)">${dineroFig(50)}</button>
      <button class="moneybtn" onclick="d1Add(20)">${dineroFig(20)}</button>
      <button class="moneybtn" onclick="d1Add(10)">${dineroFig(10)}</button>
      <button class="moneybtn" onclick="d1Add(5)">${dineroFig(5)}</button>
      <button class="moneybtn" onclick="d1Add(1)">${dineroFig(1)}</button>
    </div>
    <div class="actions" style="margin-top:8px">
      <button class="abtn" style="background:var(--rojo)" onclick="d1Quitar()">− Quitar el último</button>
    </div>
    <div class="msg ${msg.includes('Correcto')?'ok':'bad'}">${msg}</div>
  </div>`;
}
function d1Add(v){if(d1_listo)return;d1_have.push(v);const t=d1_total();
  if(t===d1_obj){d1_listo=true;estrella();festejar();render_d1(`¡Correcto! Formaste $${d1_obj} 🎉`);
    hablar(`¡Muy bien! Formaste ${d1_obj} pesos`, d1Siguiente);}
  else if(t>d1_obj){render_d1('Te pasaste. Tocá "Quitar" para sacar el último 😊');
    hablar(`Te pasaste. Tenés ${t}. Tocá quitar para sacar el último.`);}
  else{render_d1('');hablar(`Pusiste ${v}. Ahora tenés ${t} pesos. Te faltan ${d1_obj-t}.`);}}
function d1Quitar(){if(d1_listo)return;d1_have.pop();render_d1('');const t=d1_total();
  hablar(t>0?`Ahora tenés ${t} pesos. Te faltan ${d1_obj-t}.`:'No te quedó nada. Empezá de nuevo.');}

/* arranca */
bienvenida();
</script>
